  name: luma
  label:
    en_US: Luma
    zh_Hans: Luma
    ja_JP: Luma
    pt_BR: Luma
  description:
    en_US: Use the Ace Data Cloud Luma APIs in Dify workflows.
    zh_Hans: 在 Dify 工作流中使用 Ace Data Cloud Luma API。
  icon: icon.png
  icon_dark: icon.png
  tags:
