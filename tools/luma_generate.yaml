identity:
  name: luma_generate_video
  author: acedatacloud
  label:
    en_US: Luma Generate Video
    zh_Hans: Luma 生成视频
description:
  human:
    en_US: Generate a video via Ace Data Cloud Luma Videos API.
    zh_Hans: 通过 Ace Data Cloud Luma Videos API 生成视频。
  llm: Generate a video (generate/extend) via Ace Data Cloud Luma Videos API. Generation
    returns a task ID. Query the same task until complete; never resubmit a pending
    generation.
parameters:
- name: loop
  type: boolean
  required: false
  label:
    en_US: Loop
    zh_Hans: 循环视频
  human_description:
    en_US: Optional loop switch.
    zh_Hans: 可选循环开关。
  llm_description: Optional loop switch.
  form: form
  default: false
- name: action
  type: select
  required: false
  label:
    en_US: Action
    zh_Hans: 行为
  human_description:
    en_US: Choose how to generate the video.
    zh_Hans: 选择生成方式。
  llm_description: Choose how to generate the video.
  form: form
  default: generate
  options:
  - value: generate
    label:
      en_US: generate
      zh_Hans: generate
  - value: extend
    label:
      en_US: extend
      zh_Hans: extend
- name: prompt
  type: string
  required: false
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Required for generate. Optional for extend.
    zh_Hans: generate 必填，extend 可选。
  llm_description: Required for generate. Optional for extend.
  form: llm
- name: video_id
  type: string
  required: false
  label:
    en_US: Video ID
    zh_Hans: 视频ID
  human_description:
    en_US: For extend. If specified, will use video_id instead of video_url.
    zh_Hans: extend 用。若填写则优先使用 video_id。
  llm_description: For extend. If specified, will use video_id instead of video_url.
  form: form
- name: aspect_ratio
  type: string
  required: false
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  human_description:
    en_US: Optional output aspect ratio (e.g. 16:9).
    zh_Hans: 可选输出比例（如 16:9）。
  llm_description: Optional output aspect ratio (e.g. 16:9).
  form: form
  default: '16:9'
- name: video_url
  type: string
  required: false
  label:
    en_US: Video URL
    zh_Hans: 视频链接
  human_description:
    en_US: For extend. Provide the URL of an existing video.
    zh_Hans: extend 用。传入已有视频链接。
  llm_description: For extend. Provide the URL of an existing video.
  form: form
- name: enhancement
  type: boolean
  required: false
  label:
    en_US: Enhancement
    zh_Hans: 清晰度增强
  human_description:
    en_US: Optional enhancement switch.
    zh_Hans: 可选清晰度增强开关。
  llm_description: Optional enhancement switch.
  form: form
  default: true
- name: end_image_url
  type: string
  required: false
  label:
    en_US: End image URL
    zh_Hans: 尾帧图片链接
  human_description:
    en_US: Optional. The last frame reference image URL.
    zh_Hans: 可选，尾帧参考图片链接。
  llm_description: Optional. The last frame reference image URL.
  form: form
- name: start_image_url
  type: string
  required: false
  label:
    en_US: Start image URL
    zh_Hans: 首帧图片链接
  human_description:
    en_US: Optional. The first frame reference image URL.
    zh_Hans: 可选，首帧参考图片链接。
  llm_description: Optional. The first frame reference image URL.
  form: form
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/luma_generate.py
